<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 LearnSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6b21a8, #db2777, #22d3ee);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
        }
        
        .bubble { position: absolute; background: rgba(255,255,255,0.2); border-radius: 50%; pointer-events: none; animation: float 18s infinite linear; box-shadow: 0 0 30px rgba(255,255,255,0.4); }
        @keyframes float { 0% { transform: translateY(120vh) scale(1); opacity: 0.9; } 100% { transform: translateY(-100vh) scale(0.3); opacity: 0; } }
        
        .material-card, .mcq-card { transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .material-card:hover, .mcq-card:hover { transform: translateY(-15px) scale(1.04); box-shadow: 0 30px 60px -15px rgba(236, 72, 153, 0.5); }
        
        .glow-text { text-shadow: 0 0 25px rgba(165, 243, 252, 0.9); }
        .datetime-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(12px); border: 2px solid rgba(255,255,255,0.3); }
        
        .option { transition: all 0.2s; }
        .option:hover { background-color: rgba(255,255,255,0.2); }
        .correct { background-color: #22c55e !important; color: white; }
        .wrong { background-color: #ef4444 !important; color: white; }
        
        .marquee { overflow: hidden; white-space: nowrap; }
        .marquee-content { display: inline-flex; animation: marquee 25s linear infinite; }
        @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        
        /* Progress Bar */
        .progress-container { height: 8px; background: rgba(255,255,255,0.2); border-radius: 9999px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(to right, #22d3ee, #c026d3); transition: width 0.4s ease-out; }
        
        /* Encouragement Popup */
        #encouragement-popup {
            animation: popIn 0.4s ease-out forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="relative">

    <!-- Floating Bubbles -->
    <div id="bubbles" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Top Announcement -->
    <div class="marquee bg-white/10 backdrop-blur-md py-3 text-sm font-medium border-b border-white/20">
        <div id="top-marquee" class="marquee-content flex items-center gap-12 text-cyan-200"></div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-8 relative z-10">
        <!-- Header & Date/Time (unchanged) -->
        <div class="text-center mb-12">
            <h1 class="text-6xl md:text-7xl font-black mb-3 glow-text tracking-tighter">LEARNSPHERE</h1>
            <p class="text-2xl md:text-3xl opacity-90 font-medium">Ignite Your Learning Adventure! ✨</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-16">
            <div class="datetime-card rounded-3xl p-8 text-center">
                <i class="fas fa-calendar-alt text-5xl mb-4 text-cyan-300"></i>
                <div id="day" class="text-4xl font-bold"></div>
                <div class="text-sm opacity-75 mt-1">DAY</div>
            </div>
            <div class="datetime-card rounded-3xl p-8 text-center">
                <i class="fas fa-clock text-5xl mb-4 text-pink-300"></i>
                <div id="date" class="text-4xl font-bold"></div>
                <div class="text-sm opacity-75 mt-1">DATE</div>
            </div>
            <div class="datetime-card rounded-3xl p-8 text-center">
                <i class="fas fa-hourglass-half text-5xl mb-4 text-yellow-300"></i>
                <div id="time" class="text-4xl font-bold"></div>
                <div class="text-sm opacity-75 mt-1">TIME</div>
            </div>
        </div>

        <div class="flex justify-center gap-4 mb-12">
            <button onclick="showSection('materials')" class="px-8 py-4 bg-white/20 hover:bg-white/30 rounded-3xl font-bold">📚 Materials</button>
            <button onclick="showSection('mcqs')" class="px-8 py-4 bg-white/20 hover:bg-white/30 rounded-3xl font-bold">❓ MCQs</button>
        </div>

        <!-- Materials & MCQs sections (same as before) -->
        <div id="materials-section"> ... </div> <!-- Keep your existing materials code here -->
        <div id="mcqs-section" class="hidden"> ... </div> <!-- Keep your existing MCQ list -->

        <!-- Quiz Area with Progress Bar -->
        <div id="quiz-area" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 overflow-auto">
            <div class="bg-white/10 backdrop-blur-2xl rounded-3xl p-8 max-w-2xl w-full mx-4 my-8">
                
                <!-- Progress Bar -->
                <div class="mb-6">
                    <div class="flex justify-between text-sm mb-2">
                        <span id="progress-text" class="font-medium">Question 1 of 10</span>
                        <span id="progress-percent" class="font-medium">10%</span>
                    </div>
                    <div class="progress-container">
                        <div id="progress-bar" class="progress-bar" style="width: 10%"></div>
                    </div>
                </div>

                <div class="flex justify-between mb-6">
                    <div id="quiz-progress" class="font-bold text-lg"></div>
                    <div id="quiz-timer" class="font-mono text-xl text-yellow-300"></div>
                </div>
                
                <h3 id="quiz-question" class="text-2xl font-semibold mb-8"></h3>
                <div id="quiz-options" class="space-y-4"></div>
                <button onclick="nextQuestion()" id="next-btn" class="hidden mt-10 w-full bg-cyan-400 text-black font-bold py-5 rounded-3xl text-lg">Next Question →</button>
            </div>
        </div>

        <!-- Encouragement Popup -->
        <div id="encouragement-popup" class="hidden fixed top-1/3 left-1/2 transform -translate-x-1/2 bg-white/95 text-purple-900 rounded-3xl px-10 py-8 shadow-2xl z-[100] text-center max-w-xs w-full">
            <div id="encouragement-emoji" class="text-6xl mb-4"></div>
            <div id="encouragement-text" class="text-xl font-semibold"></div>
        </div>

        <!-- Results Screen (unchanged) -->
        <div id="results-screen" class="hidden fixed inset-0 ..."> ... </div>
    </div>

    <!-- Bottom Announcement -->
    <div class="marquee bg-white/10 backdrop-blur-md py-3 text-sm font-medium border-t border-white/20">
        <div id="bottom-marquee" class="marquee-content flex items-center gap-12 text-pink-200"></div>
    </div>

    <!-- Instructor Mode (unchanged) -->
    <div id="admin-section" class="hidden ..."> ... </div>

    <script>
        // === CONFIG ===
        const REPO_USERNAME = "YOUR_GITHUB_USERNAME";
        const REPO_NAME = "YOUR_REPO_NAME";

        let mcqs = JSON.parse(localStorage.getItem('learnsphere_mcqs')) || [];
        let materials = JSON.parse(localStorage.getItem('learnsphere_materials')) || [];
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval = null;
        let selectedAnswer = null;

        const announcements = [ /* your existing announcements */ ];

        // Encouragement messages at 33%, 66%, 100%
        const encouragementMessages = [
            { percent: 33, emoji: "🌟", text: "You're off to a fantastic start! Keep going!" },
            { percent: 66, emoji: "🔥", text: "Halfway there – you're doing amazing! Don't stop now!" },
            { percent: 100, emoji: "🎉", text: "You made it! Incredible effort – you're a star!" }
        ];

        function showEncouragement(percent) {
            const msg = encouragementMessages.find(m => Math.abs(m.percent - percent) < 5);
            if (!msg) return;
            
            const popup = document.getElementById('encouragement-popup');
            document.getElementById('encouragement-emoji').textContent = msg.emoji;
            document.getElementById('encouragement-text').textContent = msg.text;
            popup.classList.remove('hidden');
            
            setTimeout(() => {
                popup.classList.add('hidden');
            }, 3000);
        }

        // ... (keep all previous functions: createBubbles, updateDateTime, triple-tap, marquees, PDF/MCQ creation, render functions)

        function loadQuestion() {
            const q = currentQuiz[currentQuestionIndex];
            const total = currentQuiz.length;
            const progress = Math.round(((currentQuestionIndex) / total) * 100);
            
            // Update progress bar
            document.getElementById('progress-text').textContent = `Question ${currentQuestionIndex + 1} of ${total}`;
            document.getElementById('progress-percent').textContent = `${progress}%`;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            // Show encouragement at key milestones
            if (currentQuestionIndex > 0) {
                const milestone = Math.round((currentQuestionIndex / total) * 100);
                if ([33, 66, 100].includes(milestone)) {
                    showEncouragement(milestone);
                }
            }

            // Rest of question loading (question text, options, timer, etc.)
            // ... (your existing loadQuestion code)
            
            document.getElementById('quiz-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= currentQuiz.length) {
                showResults();
            } else {
                loadQuestion();
            }
        }

        // ... (keep the rest of your script: startQuiz, selectAnswer, showResults, etc.)

        // Initialize
        window.onload = () => {
            createBubbles();
            updateDateTime();
            setInterval(updateDateTime, 20000);
            setInterval(createBubbles, 18000);
            setupMarquees();
            
            renderMaterials();
            renderMCQList();
            showSection('materials');
        };
    </script>
</body>
</html>
