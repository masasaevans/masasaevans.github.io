<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnSphere</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');
       
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6b21a8, #db2777, #22d3ee);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
       
        .bubble { 
            position: absolute; 
            background: rgba(255,255,255,0.18); 
            border-radius: 50%; 
            pointer-events: none; 
            animation: float 20s infinite linear; 
            box-shadow: 0 0 25px rgba(255,255,255,0.35); 
        }
        @keyframes float { 
            0% { transform: translateY(120vh) scale(1); opacity: 0.85; } 
            100% { transform: translateY(-120vh) scale(0.4); opacity: 0; } 
        }
       
        .card-hover { 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .card-hover:hover { 
            transform: translateY(-8px) scale(1.02); 
        }

        .pill-btn {
            padding: 12px 20px;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
       
        .glow { text-shadow: 0 0 20px rgba(165, 243, 252, 0.8); }
        .datetime-card { 
            background: rgba(255,255,255,0.16); 
            backdrop-filter: blur(12px); 
            border: 2px solid rgba(255,255,255,0.3); 
        }

        .kenya-flag {
            width: 52px; height: 32px; 
            border: 2px solid rgba(255,255,255,0.7); 
            border-radius: 4px; overflow: hidden; position: relative;
        }
        .kenya-flag .black { background: #000; height: 33%; }
        .kenya-flag .red { background: #ef4444; height: 34%; }
        .kenya-flag .green { background: #22c55e; height: 33%; }
        .kenya-flag .shield {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 18px; height: 18px; background: #facc15; 
            border: 3px solid #000; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 10px;
        }
    </style>
</head>
<body class="relative">
    <div id="bubbles" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Top Marquee -->
    <div class="bg-white/10 py-2 text-sm border-b border-white/20 overflow-hidden">
        <div id="top-marquee" class="flex items-center gap-12 text-cyan-200 whitespace-nowrap"></div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8 relative z-10">
        <div class="flex items-center justify-center gap-4 mb-10">
            <div class="kenya-flag">
                <div class="black"></div>
                <div class="red"></div>
                <div class="green"></div>
                <div class="shield">🛡️</div>
            </div>
            <h1 class="text-5xl sm:text-6xl font-black glow tracking-tighter">LEARNSPHERE</h1>
        </div>

        <!-- Date & Time -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-12">
            <div class="datetime-card rounded-3xl p-6 text-center card-hover">
                <i class="fas fa-calendar-alt text-4xl mb-3 text-cyan-300"></i>
                <div id="day" class="text-3xl font-bold"></div>
                <div class="text-xs opacity-75">DAY</div>
            </div>
            <div class="datetime-card rounded-3xl p-6 text-center card-hover">
                <i class="fas fa-clock text-4xl mb-3 text-pink-300"></i>
                <div id="date" class="text-3xl font-bold"></div>
                <div class="text-xs opacity-75">DATE</div>
            </div>
            <div class="datetime-card rounded-3xl p-6 text-center card-hover">
                <i class="fas fa-hourglass-half text-4xl mb-3 text-yellow-300"></i>
                <div id="time" class="text-3xl font-bold font-mono"></div>
                <div class="text-xs opacity-75">TIME</div>
            </div>
        </div>

        <div class="flex flex-wrap justify-center gap-4 mb-10">
            <button onclick="showSection('extended')" 
                    class="flex-1 sm:flex-none px-8 py-4 bg-white/20 hover:bg-white/30 rounded-3xl font-bold transition-all">
                📖 Extended Class Work
            </button>
            <button onclick="showSection('assessment')" 
                    class="flex-1 sm:flex-none px-8 py-4 bg-white/20 hover:bg-white/30 rounded-3xl font-bold transition-all">
                📝 Self Assessment
            </button>
        </div>

        <!-- Extended Class Work -->
        <div id="extended-section">
            <h2 class="text-4xl font-bold text-center mb-8">Extended Class Work</h2>
            <div id="extended-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            
            <div id="extended-empty" class="text-center py-20">
                <div class="text-8xl mb-6">📚</div>
                <h3 class="text-2xl font-semibold">No PDFs yet</h3>
                <p class="opacity-80">Triple-tap anywhere to upload (Admin only)</p>
            </div>
        </div>

        <!-- Self Assessment -->
        <div id="assessment-section" class="hidden">
            <h2 class="text-4xl font-bold text-center mb-8">Self Assessment</h2>
            <div id="mcq-area" class="max-w-2xl mx-auto bg-white/10 backdrop-blur-xl rounded-3xl p-8"></div>
        </div>
    </div>

    <!-- Bottom Marquee -->
    <div class="bg-white/10 py-2 text-sm border-t border-white/20 overflow-hidden">
        <div id="bottom-marquee" class="flex items-center gap-12 text-pink-200 whitespace-nowrap"></div>
    </div>

    <!-- Admin Modal -->
    <div id="admin-section" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
        <div class="bg-white/10 backdrop-blur-2xl rounded-3xl p-8 max-w-lg w-full">
            <h2 class="text-3xl font-bold mb-6">Admin Panel</h2>
            
            <div class="flex gap-3 mb-6">
                <button onclick="showAdminTab('upload')" 
                        class="flex-1 py-3 bg-white/20 hover:bg-white/30 rounded-3xl font-bold">📤 Upload PDF</button>
                <button onclick="showAdminTab('mcq')" 
                        class="flex-1 py-3 bg-white/20 hover:bg-white/30 rounded-3xl font-bold">📝 Manage MCQ</button>
            </div>

            <!-- Upload Tab -->
            <div id="admin-upload-tab">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm mb-2">PDF Title</label>
                        <input id="file-name" type="text" placeholder="e.g. Mathematics Notes"
                               class="w-full px-5 py-4 rounded-2xl bg-white/20 text-white placeholder-gray-300 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Select PDF File</label>
                        <input id="file-input" type="file" accept=".pdf"
                               class="w-full px-5 py-4 bg-white/20 rounded-2xl text-white">
                        <p class="text-xs text-emerald-200 mt-2">Max 10MB • PDF only</p>
                    </div>
                    <button onclick="uploadPDF()" 
                            class="w-full bg-emerald-500 hover:bg-emerald-600 py-5 rounded-3xl font-bold text-lg">
                        Upload Now
                    </button>
                </div>
            </div>

            <!-- Easy MCQ Form -->
            <div id="admin-mcq-tab" class="hidden">
                <h3 class="font-bold mb-4">Add New Question</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm mb-2">Question</label>
                        <input id="new-q" type="text" placeholder="Type the full question"
                               class="w-full px-5 py-4 rounded-2xl bg-white/20 text-white placeholder-gray-300">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm mb-2">Option A</label>
                            <input id="opt0" type="text" placeholder="Option A" class="w-full px-5 py-4 rounded-2xl bg-white/20 text-white">
                        </div>
                        <div>
                            <label class="block text-sm mb-2">Option B</label>
                            <input id="opt1" type="text" placeholder="Option B" class="w-full px-5 py-4 rounded-2xl bg-white/20 text-white">
                        </div>
                        <div>
                            <label class="block text-sm mb-2">Option C</label>
                            <input id="opt2" type="text" placeholder="Option C" class="w-full px-5 py-4 rounded-2xl bg-white/20 text-white">
                        </div>
                        <div>
                            <label class="block text-sm mb-2">Option D</label>
                            <input id="opt3" type="text" placeholder="Option D" class="w-full px-5 py-4 rounded-2xl bg-white/20 text-white">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm mb-2">Correct Answer</label>
                        <select id="correct" class="w-full px-5 py-4 rounded-2xl bg-white/20 text-white">
                            <option value="0">Option A</option>
                            <option value="1">Option B</option>
                            <option value="2">Option C</option>
                            <option value="3">Option D</option>
                        </select>
                    </div>

                    <button onclick="addMCQ()" 
                            class="w-full bg-emerald-500 hover:bg-emerald-600 py-5 rounded-3xl font-bold text-lg">
                        Add Question
                    </button>

                    <div class="mt-6 pt-4 border-t border-white/30">
                        <h4 class="font-medium mb-3">Current Questions (${mcqQuestions.length})</h4>
                        <div id="mcq-list" class="text-sm max-h-60 overflow-y-auto space-y-2"></div>
                    </div>
                </div>
            </div>

            <button onclick="hideAdmin()" 
                    class="mt-8 w-full bg-red-500 hover:bg-red-600 py-4 rounded-3xl font-bold">
                    Cancel / Logout
            </button>
        </div>
    </div>

    <script>
        let extendedWorks = JSON.parse(localStorage.getItem('learnsphere_extended')) || [];
        let mcqQuestions = JSON.parse(localStorage.getItem('learnsphere_mcqs')) || [];
        let isAdminMode = false;

        const announcements = ["🇰🇪 Karibu LearnSphere", "Triple-tap for Admin", "Master every topic", "Keep shining!"];

        function createBubbles() {
            const container = document.getElementById('bubbles');
            container.innerHTML = '';
            for (let i = 0; i < 18; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 70 + 20;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.animationDuration = `${Math.random() * 22 + 14}s`;
                bubble.style.animationDelay = `-${Math.random() * 18}s`;
                container.appendChild(bubble);
            }
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('day').textContent = now.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            document.getElementById('time').textContent = now.toLocaleTimeString('en-US', {
                hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
            });
        }

        // Fixed triple-click handler - only counts clicks on body, not inside form inputs
        let tapCount = 0;
        let tapTimer = null;

        document.addEventListener('click', function(e) {
            // If we are inside the admin modal, only allow triple-click on the background or non-input elements
            if (document.getElementById('admin-section').classList.contains('hidden') === false) {
                if (e.target.closest('input, textarea, select, button')) {
                    tapCount = 0; // Reset counter when interacting with form
                    return;
                }
            }

            tapCount++;
            if (tapCount === 1) {
                tapTimer = setTimeout(() => { tapCount = 0; }, 700);
            }
            if (tapCount === 3) {
                clearTimeout(tapTimer);
                tapCount = 0;

                if (document.getElementById('admin-section').classList.contains('hidden')) {
                    // Open admin
                    isAdminMode = true;
                    document.getElementById('admin-section').classList.remove('hidden');
                    showAdminTab('upload');
                    renderExtended();
                    loadCurrentMCQs();
                } else {
                    // Close admin (logout)
                    hideAdmin();
                }
            }
        });

        function hideAdmin() {
            isAdminMode = false;
            document.getElementById('admin-section').classList.add('hidden');
            renderExtended();
        }

        function showAdminTab(tab) {
            document.getElementById('admin-upload-tab').classList.add('hidden');
            document.getElementById('admin-mcq-tab').classList.add('hidden');
            document.getElementById('admin-' + tab + '-tab').classList.remove('hidden');
        }

        function uploadPDF() {
            const fileInput = document.getElementById('file-input');
            const nameInput = document.getElementById('file-name').value.trim();
            if (!fileInput.files.length) return alert("Please select a PDF file");
            const file = fileInput.files[0];
            if (file.type !== "application/pdf") return alert("Only PDF files allowed!");
            if (file.size > 10 * 1024 * 1024) return alert("Maximum file size is 10MB");

            const displayName = nameInput || file.name.replace('.pdf', '');
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result.split(',')[1];
                extendedWorks.push({ name: displayName, base64: base64, size: file.size });
                localStorage.setItem('learnsphere_extended', JSON.stringify(extendedWorks));
                renderExtended();
                hideAdmin();
                document.getElementById('file-name').value = '';
                fileInput.value = '';
                alert(`"${displayName}.pdf" uploaded successfully!`);
            };
            reader.readAsDataURL(file);
        }

        function addMCQ() {
            const q = document.getElementById('new-q').value.trim();
            const opt0 = document.getElementById('opt0').value.trim();
            const opt1 = document.getElementById('opt1').value.trim();
            const opt2 = document.getElementById('opt2').value.trim();
            const opt3 = document.getElementById('opt3').value.trim();
            const correct = parseInt(document.getElementById('correct').value);

            if (!q || !opt0 || !opt1 || !opt2 || !opt3) {
                alert("Please fill all fields");
                return;
            }

            mcqQuestions.push({
                q: q,
                options: [opt0, opt1, opt2, opt3],
                answer: correct
            });

            localStorage.setItem('learnsphere_mcqs', JSON.stringify(mcqQuestions));
            alert("Question added successfully!");
            
            // Clear form
            document.getElementById('new-q').value = '';
            document.getElementById('opt0').value = '';
            document.getElementById('opt1').value = '';
            document.getElementById('opt2').value = '';
            document.getElementById('opt3').value = '';

            loadCurrentMCQs();
        }

        function loadCurrentMCQs() {
            const container = document.getElementById('mcq-list');
            container.innerHTML = '';
            if (mcqQuestions.length === 0) {
                container.innerHTML = '<p class="opacity-60 text-center py-4">No questions added yet</p>';
                return;
            }
            mcqQuestions.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "bg-white/10 p-3 rounded-2xl flex justify-between items-center";
                div.innerHTML = `
                    <span class="text-sm pr-2">${i+1}. ${item.q.substring(0,55)}${item.q.length > 55 ? '...' : ''}</span>
                    <button onclick="deleteMCQ(${i})" class="text-red-400 text-xs px-3">Delete</button>
                `;
                container.appendChild(div);
            });
        }

        function deleteMCQ(i) {
            if (confirm("Delete this question?")) {
                mcqQuestions.splice(i, 1);
                localStorage.setItem('learnsphere_mcqs', JSON.stringify(mcqQuestions));
                loadCurrentMCQs();
            }
        }

        function viewPDF(base64, filename) {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const tab = window.open(url, '_blank');
            if (tab) tab.document.title = filename + ".pdf";
            setTimeout(() => URL.revokeObjectURL(url), 60000);
        }

        function downloadPDF(base64, filename) {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename + ".pdf";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 5000);
        }

        function deleteWork(index) {
            if (confirm("Delete this PDF?")) {
                extendedWorks.splice(index, 1);
                localStorage.setItem('learnsphere_extended', JSON.stringify(extendedWorks));
                renderExtended();
            }
        }

        function renderExtended() {
            const grid = document.getElementById('extended-grid');
            const empty = document.getElementById('extended-empty');
            grid.innerHTML = '';

            if (extendedWorks.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            extendedWorks.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card-hover bg-white/10 backdrop-blur-xl rounded-3xl p-6';
                card.innerHTML = `
                    <div class="flex items-center gap-3 mb-6">
                        <i class="fas fa-file-pdf text-5xl text-red-400"></i>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-lg truncate">${item.name}</h3>
                            <p class="text-xs opacity-75">${(item.size / 1024 / 1024).toFixed(1)} MB</p>
                        </div>
                    </div>
                    <div class="bg-black/40 rounded-2xl mb-6 h-44 flex items-center justify-center border border-red-400/30">
                        <i class="fas fa-file-pdf text-6xl text-red-400"></i>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="viewPDF('${item.base64}', '${item.name.replace(/'/g, "\\'")}')" 
                                class="pill-btn bg-white text-black hover:bg-gray-100">👁️ View</button>
                        <button onclick="downloadPDF('${item.base64}', '${item.name.replace(/'/g, "\\'")}')" 
                                class="pill-btn bg-white text-black hover:bg-gray-100">⬇️ Download</button>
                    </div>
                    ${isAdminMode ? `
                    <button onclick="deleteWork(${index})" 
                            class="w-full mt-4 border border-red-400 font-bold py-3 rounded-3xl text-red-300 hover:text-red-400">
                        🗑️ Delete (Admin only)
                    </button>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function loadMCQ() {
            const container = document.getElementById('mcq-area');
            if (mcqQuestions.length === 0) {
                container.innerHTML = `<div class="text-center py-16 opacity-75"><div class="text-6xl mb-6">❓</div><p>No MCQs available yet.<br>Admin has not added any questions.</p></div>`;
                return;
            }

            let html = `<div class="space-y-8">`;
            mcqQuestions.forEach((item, i) => {
                html += `
                    <div>
                        <p class="font-semibold mb-4">${i+1}. ${item.q}</p>
                        <div class="space-y-3">
                            ${item.options.map((opt, j) => `
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="radio" name="q${i}" value="${j}" class="w-5 h-5 accent-emerald-400">
                                    <span>${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>`;
            });
            html += `<button onclick="submitMCQ()" class="w-full bg-emerald-500 hover:bg-emerald-600 py-5 rounded-3xl font-bold text-lg mt-6">Submit Answers</button></div>`;
            container.innerHTML = html;
        }

        function submitMCQ() {
            let score = 0;
            mcqQuestions.forEach((item, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && parseInt(selected.value) === item.answer) score++;
            });

            const percentage = Math.round((score / mcqQuestions.length) * 100);
            const appreciation = percentage >= 80 ? "Excellent! You're doing very well! 🎉" :
                                percentage >= 60 ? "Good job! Keep practicing! 👏" : 
                                "Nice effort! Review the topics and try again 💪";

            const container = document.getElementById('mcq-area');
            container.innerHTML = `
                <div class="text-center py-12">
                    <div class="text-7xl mb-4">🏆</div>
                    <h3 class="text-3xl font-bold mb-3">Your Score</h3>
                    <div class="text-8xl font-black text-emerald-300 mb-6">${percentage}%</div>
                    <div class="w-full bg-white/20 h-5 rounded-full mb-8 overflow-hidden">
                        <div class="h-full bg-emerald-400 rounded-full transition-all duration-1000" style="width: ${percentage}%"></div>
                    </div>
                    <p class="text-xl font-medium">${appreciation}</p>
                    <button onclick="loadMCQ()" 
                            class="mt-10 px-10 py-4 bg-white/20 hover:bg-white/30 rounded-3xl font-bold">
                        Try Again
                    </button>
                </div>
            `;
        }

        function showSection(section) {
            document.getElementById('extended-section').classList.add('hidden');
            document.getElementById('assessment-section').classList.add('hidden');
            document.getElementById(section + '-section').classList.remove('hidden');
            
            if (section === 'extended') renderExtended();
            if (section === 'assessment') loadMCQ();
        }

        function setupMarquees() {
            const html = announcements.map(t => `<span class="mx-10">${t}</span>`).join('');
            document.getElementById('top-marquee').innerHTML = html + html;
            document.getElementById('bottom-marquee').innerHTML = html + html;
        }

        window.onload = () => {
            isAdminMode = false;
            createBubbles();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            setInterval(createBubbles, 25000);
            setupMarquees();
            renderExtended();
            showSection('extended');
        };
    </script>
</body>
</html>
