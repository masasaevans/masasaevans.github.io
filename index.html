<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masasa Online - Welcome!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body class="min-h-screen font-sans">

  <!-- Role Selection Overlay (shows on first load) -->
  <div id="role-overlay" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 text-center shadow-2xl transform scale-100 transition-all">
      <h2 id="welcome-title" class="text-4xl font-extrabold mb-6 text-indigo-700 animate-bounce">Welcome to Masasa Online 🎉</h2>
      <p class="text-xl mb-8 text-gray-700">Who are you today?</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <button onclick="selectRole('learner')" class="role-btn bg-gradient-to-br from-[#FF6B6B] to-[#FF8E53] text-white py-6 rounded-2xl text-xl font-bold shadow-lg hover:scale-105 transition">
          Learner 👩‍🎓
        </button>
        <button onclick="selectRole('parent')" class="role-btn bg-gradient-to-br from-[#4ECDC4] to-[#556270] text-white py-6 rounded-2xl text-xl font-bold shadow-lg hover:scale-105 transition">
          Parent 👨‍👩‍👧
        </button>
        <button onclick="showTeacherLogin()" class="role-btn bg-gradient-to-br from-indigo-600 to-indigo-800 text-white py-6 rounded-2xl text-xl font-bold shadow-lg hover:scale-105 transition">
          Teacher 👩‍🏫
        </button>
      </div>

      <!-- Hidden Teacher Login Form -->
      <div id="teacher-login" class="hidden mt-8">
        <input id="teacher-email" type="email" placeholder="Admin email (@masasaadmin.ke)" class="w-full p-4 mb-4 border-2 border-indigo-300 rounded-xl text-lg">
        <input id="teacher-pass" type="password" placeholder="Password" class="w-full p-4 mb-4 border-2 border-indigo-300 rounded-xl text-lg">
        <button onclick="validateTeacher()" class="bg-green-600 text-white px-10 py-4 rounded-2xl text-lg font-bold w-full mt-2 hover:bg-green-700">
          Login as Teacher
        </button>
        <button onclick="hideTeacherLogin()" class="text-gray-600 mt-4 underline">Back</button>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <header id="main-header" class="hidden bg-gradient-to-r from-indigo-700 to-indigo-900 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold">Masasa Online 🇰🇪</h1>
      <button onclick="resetRole()" class="bg-white/20 px-6 py-2 rounded-lg hover:bg-white/30">
        Change Role
      </button>
    </div>
  </header>

  <div id="main-content" class="max-w-6xl mx-auto px-4 py-6 hidden">
    <!-- Tabs and rest of your previous content here -->
    <!-- ... paste your previous tabs, assignments, quizzes sections here ... -->
    <!-- For brevity I'm not repeating the full 300+ lines, just keep your existing sections inside this div -->
    <!-- Make sure to add class="learner-theme" or similar where needed for colors -->

    <!-- Example: override some colors for learner mode -->
    <style id="dynamic-styles"></style>
  </div>

  <footer class="text-center py-8 text-gray-500 text-sm mt-auto">
    Masasa Online • Static • Made with ❤️ in Nairobi
  </footer>
</body>
</html>
