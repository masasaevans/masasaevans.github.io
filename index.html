<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masasa Online | Quick Quiz Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-indigo-50 font-sans antialiased overflow-x-hidden">

<div class="bg-yellow-400 py-3 border-b-2 border-yellow-600 sticky top-0 z-[60] overflow-hidden">
    <div class="marquee-wrapper">
        <span id="marquee-text" class="text-yellow-900 font-black text-lg uppercase tracking-widest">
            Welcome to Masasa Online! Practice your CBC and JSS skills here! 🚀
        </span>
    </div>
</div>

<div id="role-overlay" class="fixed inset-0 bg-indigo-900/95 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-[3rem] p-10 max-w-md w-full text-center shadow-2xl border-8 border-white">
    <div class="mb-6 p-4 bg-indigo-50 rounded-3xl border-2 border-indigo-100">
        <div id="live-time" class="text-4xl font-black text-slate-800 mb-1">00:00:00</div>
        <div id="location-display" class="text-indigo-500 font-bold text-sm uppercase">📍 Detecting...</div>
    </div>

    <h1 class="bubble-text text-5xl font-black text-indigo-600 mb-8 cursor-default">Masasa Online</h1>
    
    <div id="role-buttons" class="space-y-4">
        <button onclick="selectRole('student')" class="learner-btn w-full bg-orange-500 text-white py-6 rounded-3xl text-2xl font-black shadow-[0_10px_0_#c2410c] transition-all">Learner Place 👩‍🎓</button>
        <button onclick="showAdminLogin()" class="w-full bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold hover:bg-slate-200 transition-all">Admin 🔐</button>
    </div>

    <div id="admin-login" class="hidden mt-6 animate-fade-in">
      <div class="bg-red-50 p-4 rounded-2xl text-red-700 font-bold mb-4 text-sm border-2 border-red-100">
        ⚠️ Hello Mr. Evans Masasa
      </div>
      <input id="admin-pass" type="password" placeholder="Admin Key" class="w-full p-4 border-2 border-indigo-100 rounded-2xl mb-4 text-center font-bold outline-none focus:border-indigo-600">
      <button onclick="validateAdmin()" class="w-full bg-indigo-700 text-white py-4 rounded-2xl font-black shadow-lg">Login</button>
      <button onclick="hideAdminLogin()" class="mt-4 text-slate-400 text-sm font-bold uppercase underline block w-full text-center">Back</button>
    </div>
  </div>
</div>

<header id="main-header" class="hidden bg-white/90 backdrop-blur-md border-b-2 border-indigo-100 p-4 sticky top-12 z-40">
  <div class="max-w-6xl mx-auto flex justify-between items-center px-4">
    <h1 class="bubble-text text-2xl text-indigo-600">Masasa Portal</h1>
    <button onclick="location.reload()" class="bg-red-50 text-red-500 px-6 py-2 rounded-full font-black text-xs border-2 border-red-100">LOGOUT</button>
  </div>
</header>

<main id="main-content" class="max-w-6xl mx-auto p-6 hidden">
  
  <section id="admin-tools" class="hidden mb-12 p-8 bg-white rounded-[2.5rem] shadow-xl border-4 border-indigo-200">
      <h3 class="text-2xl font-black text-indigo-700 mb-6 uppercase">Admin Control Panel</h3>
      
      <div class="mb-8">
          <label class="font-bold text-slate-500 block mb-2">Update Marquee Text</label>
          <div class="flex gap-2">
            <input id="ann-input" type="text" class="flex-1 p-4 border rounded-2xl bg-slate-50 font-bold outline-none focus:border-indigo-500" placeholder="Type new announcement...">
            <button onclick="updateAnnouncement()" class="bg-yellow-400 px-8 rounded-2xl font-black text-yellow-900 shadow-md">APPLY</button>
          </div>
      </div>

      <div class="bg-indigo-50 p-6 rounded-3xl border-2 border-indigo-100">
          <h4 class="font-black text-indigo-700 mb-4">Upload PDF Lessons</h4>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input id="pdf-title" type="text" placeholder="Lesson Title (e.g. Algebra Intro)" class="p-4 rounded-xl border outline-none">
              <input id="pdf-file" type="file" accept="application/pdf" class="p-3 rounded-xl border bg-white">
              <div class="flex flex-col">
                  <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Expiry Date (Optional)</label>
                  <input id="pdf-expiry" type="date" class="p-4 rounded-xl border outline-none">
              </div>
              <button onclick="uploadPDF()" class="bg-indigo-600 text-white font-black rounded-xl shadow-lg hover:bg-indigo-700 transition-all">POST LESSON</button>
          </div>
      </div>
  </section>

  <section class="mb-8 p-6 md:p-10 bg-white rounded-[2.5rem] shadow-xl border-4 border-white text-center">
    <h2 class="text-3xl md:text-4xl font-black text-indigo-700 mb-6">QUICK QUIZ 🚀</h2>
    
    <div class="flex flex-col gap-5 max-w-md mx-auto">
        <select id="subject-select" onchange="handleSubjectChange()" class="w-full p-5 rounded-2xl border-4 border-indigo-50 font-black text-indigo-600 outline-none focus:border-indigo-400">
            <option value="">Select Subject...</option>
            <option value="literacy">Literacy (Passage & Grammar) 📖</option>
            <option value="numeracy">Numeracy (Maths) 🔢</option>
        </select>
        
        <div id="grade-container" class="hidden animate-bounce-in">
            <select id="grade-select" onchange="handleGradeChange()" class="w-full p-5 rounded-2xl border-4 border-orange-100 font-black text-orange-500 outline-none focus:border-orange-400">
                <option value="">Pick Your Grade...</option>
                <option value="G1">Grade 1</option><option value="G2">Grade 2</option><option value="G3">Grade 3</option>
                <option value="G4">Grade 4</option><option value="G5">Grade 5</option><option value="G6">Grade 6</option>
                <option value="G7">Grade 7</option><option value="G8">Grade 8</option><option value="G9">Grade 9</option>
            </select>
        </div>
    </div>

    <button onclick="generateAIQuiz()" id="start-btn" class="hidden mt-8 w-full md:w-auto bg-indigo-600 text-white px-16 py-5 rounded-full font-black text-2xl shadow-xl transition-all hover:bg-orange-500">
      GENERATE 10 QUESTIONS ✍️
    </button>
  </section>

  <section id="lessons-area" class="mb-12">
      <h3 class="text-2xl font-black text-indigo-700 mb-6 px-4">Learner Place 📚</h3>
      <div id="pdf-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </section>

  <div id="quiz-area" class="hidden space-y-6 pb-32"></div>
</main>

<div id="score-modal" class="hidden fixed inset-0 bg-indigo-900/95 flex items-center justify-center z-[100] p-4">
    <div class="bg-white rounded-[3rem] p-10 max-w-sm w-full text-center border-8 border-white animate-pop-in">
        <div class="text-8xl mb-4" id="score-emoji">🎉</div>
        <div id="final-percent" class="text-7xl font-black text-orange-500 mb-2">0%</div>
        <p id="score-feedback" class="text-lg font-bold text-slate-500 mb-8 italic">Superb Work! 🌟</p>
        <button onclick="location.reload()" class="w-full bg-indigo-700 text-white py-4 rounded-2xl font-black shadow-lg">Great! Done</button>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
