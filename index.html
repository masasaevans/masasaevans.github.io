<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Masasa Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
</head>

<body class="bg-gradient-to-br from-orange-50 to-indigo-50 min-h-screen">

<!-- ROLE SELECT -->
<div id="overlay" class="fixed inset-0 bg-black/70 flex items-center justify-center">
  <div class="bg-white p-10 rounded-3xl text-center">
    <h1 class="text-3xl font-bold mb-6 text-orange-600">Masasa Online 🚀</h1>

    <button onclick="enterStudent()" class="block w-full bg-orange-500 text-white py-4 rounded mb-4">
      Student
    </button>

    <button onclick="showAdminLogin()" class="block w-full bg-indigo-600 text-white py-4 rounded mb-4">
      Admin
    </button>

    <button onclick="googleLogin()" class="block w-full border py-4 rounded">
      Google Login
    </button>
  </div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminBox" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl">
    <input id="adminPass" type="password" placeholder="Admin password" class="p-3 border mb-4 w-full">
    <button onclick="loginAdmin()" class="bg-indigo-600 text-white px-6 py-2 w-full">Login</button>
  </div>
</div>

<header class="hidden p-4 bg-white shadow flex justify-between" id="header">
  <h1 class="font-bold text-orange-600">Masasa</h1>
  <div>
    <span id="time"></span>
    <button onclick="logout()" class="ml-4 bg-red-500 text-white px-3 py-1">Logout</button>
  </div>
</header>

<main id="app" class="hidden p-6">

<div id="adminPanel" class="hidden mb-6 bg-white p-6 rounded shadow">
  <h2 class="font-bold mb-3">Upload PDF</h2>
  <input id="title" placeholder="Title" class="border p-2 w-full mb-2">
  <input id="file" type="file" class="mb-2">
  <button onclick="upload()" class="bg-green-600 text-white px-4 py-2">Upload</button>
</div>

<h2 class="font-bold mb-3">Materials</h2>
<div id="materials"></div>

</main>

<script type="module" src="index.js"></script>
</body>
</html>
