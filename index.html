<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masasa Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-gray-50 font-sans antialiased">

<!-- ROLE OVERLAY -->
<div id="role-overlay" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
    <h1 class="text-4xl font-extrabold text-indigo-700 mb-6">Masasa Online 🎉</h1>
    <p class="text-lg mb-8">Who are you today?</p>
    
    <button onclick="selectRole('student')" class="btn-pop w-full bg-gradient-to-br from-red-500 to-orange-500 text-white py-6 rounded-2xl text-2xl font-bold mb-4">Learner 👩‍🎓</button>
    <button onclick="selectRole('parent')" class="btn-pop w-full bg-gradient-to-br from-teal-400 to-cyan-500 text-white py-6 rounded-2xl text-2xl font-bold mb-4">Parent 👨‍👩‍👧</button>
    <button onclick="showTeacherLogin()" class="btn-pop w-full bg-gradient-to-br from-indigo-600 to-indigo-900 text-white py-6 rounded-2xl text-2xl font-bold">Teacher 👩‍🏫</button>

    <div id="teacher-login" class="hidden mt-8">
      <input id="teacher-username" type="text" placeholder="Username" class="w-full p-4 mb-3 border-2 border-indigo-300 rounded-xl">
      <div class="relative mb-4">
        <input id="teacher-pass" type="password" placeholder="Password" class="w-full p-4 border-2 border-indigo-300 rounded-xl pr-12">
        <button onclick="toggleVisibility(this)" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-2xl">👁️</button>
      </div>
      <button onclick="validateTeacher()" class="btn-pop bg-green-600 text-white w-full py-4 rounded-2xl text-lg font-bold">Login as Teacher</button>
      <div id="login-error" class="text-red-500 text-sm mt-2 hidden"></div>
    </div>
  </div>
</div>

<!-- HEADER WITH EXIT -->
<header id="main-header" class="hidden bg-indigo-700 text-white p-4 sticky top-0 z-40 shadow">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    <h1 class="text-2xl font-bold">Masasa Online 🇰🇪</h1>
    <button onclick="resetRole()" class="btn-pop bg-white/20 px-6 py-2 rounded-lg">Exit / Change Role</button>
  </div>
</header>

<!-- SUCCESS BANNER -->
<div id="success-banner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-8 py-3 rounded-2xl shadow-xl flex items-center gap-3 z-[90]">
  <span id="banner-text" class="font-medium"></span>
</div>

<main id="main-content" class="max-w-6xl mx-auto p-6 hidden">
  <div class="flex border-b mb-6">
    <button onclick="switchTab(0)" id="tab-0" class="tab-button active px-8 py-3 font-medium">Assignments</button>
    <button onclick="switchTab(2)" id="tab-2" class="tab-button px-8 py-3 font-medium">Daily English 📖</button>
  </div>

  <!-- Assignments -->
  <section id="assignments-section">
    <div id="teacher-form" class="hidden bg-white p-6 rounded-2xl shadow mb-8">
      <input id="ass-title" placeholder="Title" class="w-full p-3 border rounded mb-3">
      <textarea id="ass-desc" placeholder="Description" class="w-full p-3 border rounded h-24"></textarea>
      <button onclick="addAssignment()" class="btn-pop mt-4 bg-indigo-600 text-white px-8 py-3 rounded-xl">Post Assignment</button>
    </div>
    <div id="assignments-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </section>

  <!-- Daily English -->
  <section id="english-section" class="hidden bg-white rounded-3xl p-8 shadow">
    <h2 id="english-title" class="text-3xl font-bold mb-2 text-red-600"></h2>
    <div id="story-box" class="bg-amber-50 p-6 rounded-2xl mb-8"></div>
    
    <!-- Questions area -->
    <div id="questions-area" class="space-y-6"></div>
    
    <!-- Score result (hidden by default) -->
    <div id="score-result" class="hidden text-center py-10">
      <div class="text-6xl mb-4">🎉</div>
      <h3 class="text-5xl font-bold text-emerald-600 mb-2" id="score-percent"></h3>
      <p class="text-xl text-gray-600" id="score-text"></p>
      <button onclick="restartQuiz()" class="btn-pop mt-6 bg-emerald-600 text-white px-10 py-3 rounded-2xl">Try Again Tomorrow</button>
    </div>
    
    <button onclick="submitEnglishQuiz()" id="submit-btn" class="btn-pop mt-8 bg-emerald-600 text-white w-full py-4 rounded-2xl text-lg font-bold">Submit & See Score</button>
  </section>
</main>

<script src="index.js"></script>
</body>
</html>
