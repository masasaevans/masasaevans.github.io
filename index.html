<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnSphere • Kenya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&family=Inter:wght@400;500;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4c1d95, #9f1239, #0e7490);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .bubble { 
            position: absolute; 
            background: rgba(255,255,255,0.15); 
            border-radius: 50%; 
            pointer-events: none; 
            animation: float 22s infinite linear; 
            box-shadow: 0 0 30px rgba(165, 243, 252, 0.4);
        }

        @keyframes float { 
            0% { transform: translateY(120vh) scale(1); opacity: 0.9; } 
            100% { transform: translateY(-120vh) scale(0.3); opacity: 0; } 
        }

        .card-hover {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-hover:hover {
            transform: translateY(-12px) scale(1.04);
        }

        .glow {
            text-shadow: 0 0 40px rgba(103, 232, 249, 0.9), 0 0 70px rgba(236, 72, 153, 0.7);
        }

        .kenya-flag {
            width: 64px; height: 40px;
            border: 3px solid rgba(255,255,255,0.95);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .marquee { animation: marquee 28s linear infinite; }
        @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .glass {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* Fireworks / Confetti Animation */
        .firework-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .emoji-pop {
            position: absolute;
            font-size: 2.5rem;
            animation: popUp 3.5s ease-out forwards;
            text-shadow: 0 0 15px rgba(255,255,255,0.9);
            user-select: none;
        }

        @keyframes popUp {
            0% {
                transform: translateY(100px) scale(0.2) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-600px) scale(1.2) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="relative">

    <div id="bubbles" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Top Marquee -->
    <div class="bg-white/10 py-3.5 text-sm border-b border-white/20 backdrop-blur-md">
        <div id="top-marquee" class="flex items-center gap-12 text-cyan-100 whitespace-nowrap marquee text-base font-medium"></div>
    </div>

    <div class="max-w-7xl mx-auto px-6 py-10 relative z-10">
        <!-- Header -->
        <div class="flex items-center justify-center gap-6 mb-12">
            <div class="kenya-flag flex-shrink-0">
                <div class="h-[33%] bg-black"></div>
                <div class="h-[34%] bg-[#e30613]"></div>
                <div class="h-[33%] bg-[#00a650]"></div>
                <div class="absolute inset-0 flex items-center justify-center text-3xl">🛡️</div>
            </div>
            <h1 class="text-6xl sm:text-7xl font-black tracking-tighter glow">LEARNSPHERE</h1>
        </div>

        <!-- Date & Time -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-14">
            <div class="glass rounded-3xl p-8 text-center card-hover">
                <i class="fas fa-calendar-day text-5xl mb-4 text-cyan-300"></i>
                <div id="day" class="text-4xl font-bold"></div>
                <div class="text-xs tracking-widest opacity-75 mt-1">DAY</div>
            </div>
            <div class="glass rounded-3xl p-8 text-center card-hover">
                <i class="fas fa-calendar-alt text-5xl mb-4 text-pink-300"></i>
                <div id="date" class="text-4xl font-bold"></div>
                <div class="text-xs tracking-widest opacity-75 mt-1">DATE</div>
            </div>
            <div class="glass rounded-3xl p-8 text-center card-hover">
                <i class="fas fa-clock text-5xl mb-4 text-amber-300"></i>
                <div id="time" class="text-4xl font-bold font-mono"></div>
                <div class="text-xs tracking-widest opacity-75 mt-1">TIME</div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="flex flex-wrap justify-center gap-4 mb-16">
            <button onclick="showSection('extended')" class="pill-btn bg-white/20 hover:bg-white/30 text-lg px-12 py-6 flex items-center gap-3">
                📖 Extended Class Work
            </button>
            <button onclick="showSection('assessment')" class="pill-btn bg-white/20 hover:bg-white/30 text-lg px-12 py-6 flex items-center gap-3">
                📝 Self Assessment
            </button>
        </div>

        <!-- Extended Section -->
        <div id="extended-section" class="hidden">
            <h2 class="text-4xl font-bold mb-10 text-center">📚 Extended Class Work</h2>
            <div id="extended-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            <div id="extended-empty" class="hidden text-center py-24">
                <div class="text-9xl mb-6">📚</div>
                <h3 class="text-3xl font-semibold">No materials yet</h3>
                <p class="opacity-75 mt-3">Triple tap anywhere to open Admin Panel</p>
            </div>
        </div>

        <!-- Assessment Section -->
        <div id="assessment-section" class="hidden">
            <h2 class="text-4xl font-bold text-center mb-10">📝 Self Assessment</h2>
            <div id="mcq-area" class="max-w-3xl mx-auto glass rounded-3xl p-10 min-h-[500px]"></div>
        </div>
    </div>

    <!-- Bottom Marquee -->
    <div class="bg-white/10 py-3.5 text-sm border-t border-white/20 backdrop-blur-md mt-16">
        <div id="bottom-marquee" class="flex items-center gap-12 text-pink-100 whitespace-nowrap marquee"></div>
    </div>

    <!-- Fireworks Container -->
    <div id="fireworks" class="firework-container hidden"></div>

    <!-- Admin Modal (unchanged for brevity - keep your existing admin code) -->
    <!-- ... (paste your full admin modal here from previous version) ... -->

    <script>
        // Existing variables and functions (keep all your previous JS)
        let extendedWorks = JSON.parse(localStorage.getItem('learnsphere_extended')) || [];
        let mcqQuestions = JSON.parse(localStorage.getItem('learnsphere_mcqs')) || [];
        let isAdminMode = false;

        const celebratoryEmojis = ['🎉', '🥳', '🌟', '✨', '💥', '🚀', '🏆', '🔥', '👏', '🙌', '💯', '⭐', '🌈'];

        function createBubbles() { /* your existing bubble code */ }

        function updateDateTime() { /* your existing datetime code */ }

        // === NEW FIREWORKS FUNCTION ===
        function launchFireworks(count = 35) {
            const container = document.getElementById('fireworks');
            container.classList.remove('hidden');

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.className = 'emoji-pop';
                    emoji.textContent = celebratoryEmojis[Math.floor(Math.random() * celebratoryEmojis.length)];
                    
                    // Random starting position at bottom
                    const startX = Math.random() * window.innerWidth;
                    emoji.style.left = `${startX}px`;
                    emoji.style.bottom = `-50px`;
                    
                    // Random horizontal drift and rotation
                    const drift = (Math.random() - 0.5) * 300;
                    const duration = 2.8 + Math.random() * 1.5;
                    const delay = Math.random() * 0.6;
                    
                    emoji.style.animationDuration = `${duration}s`;
                    emoji.style.animationDelay = `${delay}s`;
                    
                    // Add slight random horizontal movement via CSS variable
                    emoji.style.setProperty('--drift', `${drift}px`);
                    
                    container.appendChild(emoji);

                    // Remove after animation
                    setTimeout(() => {
                        emoji.remove();
                    }, (duration + delay) * 1000 + 500);
                }, i * 25); // Stagger the launches
            }

            // Auto hide container after fireworks finish
            setTimeout(() => {
                container.classList.add('hidden');
            }, 4500);
        }

        // Updated submitMCQ with fireworks
        function submitMCQ() {
            let score = 0;
            mcqQuestions.forEach((item, i) => {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && parseInt(selected.value) === item.answer) score++;
            });

            const percentage = mcqQuestions.length ? Math.round((score / mcqQuestions.length) * 100) : 0;

            let appreciation = "";
            let mainEmoji = "";

            if (percentage >= 85) {
                appreciation = "Outstanding! You're a true champion! 🌟";
                mainEmoji = "🏆";
            } else if (percentage >= 70) {
                appreciation = "Excellent work! Keep shining! 👏";
                mainEmoji = "🔥";
            } else if (percentage >= 50) {
                appreciation = "Good effort! You're improving every day 💪";
                mainEmoji = "📈";
            } else {
                appreciation = "Nice try! Review and try again — you've got this! 💡";
                mainEmoji = "🌱";
            }

            const container = document.getElementById('mcq-area');
            container.innerHTML = `
                <div class="text-center py-12 relative">
                    <div class="text-8xl mb-6">${mainEmoji}</div>
                    <h3 class="text-4xl font-bold mb-4">Your Score</h3>
                    <div class="text-[7rem] font-black text-emerald-300 leading-none mb-6">${percentage}<span class="text-6xl">%</span></div>
                    
                    <div class="w-full max-w-md mx-auto bg-white/20 h-3 rounded-full mb-10 overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-emerald-400 to-cyan-400 rounded-full transition-all duration-1000" 
                             style="width: ${percentage}%"></div>
                    </div>
                    
                    <p class="text-2xl font-medium max-w-md mx-auto">${appreciation}</p>
                    
                    <button onclick="loadMCQ()" 
                            class="mt-10 px-14 py-6 bg-white/20 hover:bg-white/30 rounded-3xl font-bold text-lg transition-all">
                        Try Again
                    </button>
                </div>
            `;

            // Launch fireworks based on performance
            if (percentage >= 60) {
                launchFireworks(45);   // Big celebration
            } else if (percentage >= 40) {
                launchFireworks(25);   // Medium celebration
            } else {
                launchFireworks(12);   // Small encouragement
            }
        }

        // Keep all your other functions: showSection, renderExtended, uploadPDF, addMCQ, etc.

        function setupMarquees() {
            const announcements = [
                "🇰🇪 Karibu LearnSphere Kenya",
                "Master every subject with confidence",
                "Practice today • Succeed tomorrow",
                "Education is the key to success"
            ];
            const html = announcements.map(text => `<span class="mx-12">${text}</span>`).join('');
            document.getElementById('top-marquee').innerHTML = html + html;
            document.getElementById('bottom-marquee').innerHTML = html + html;
        }

        window.onload = () => {
            createBubbles();
            updateDateTime();
            setInterval(updateDateTime, 1000);
            setInterval(createBubbles, 30000);
            setupMarquees();
            showSection('extended');
        };
    </script>
</body>
</html>
