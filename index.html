<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Masasa Online - Learn Smarter</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <!-- ROLE OVERLAY -->
  <div id="role-overlay" class="overlay">
    <div class="panel">
      <h1>Masasa Online 🚀</h1>

      <button onclick="selectRole()">👨‍🎓 Student</button>
      <button onclick="showAdminLogin()">👨‍💼 Admin</button>
      <button onclick="signInWithGoogle()">Google Login</button>
    </div>
  </div>

  <!-- ADMIN LOGIN -->
  <div id="admin-login" class="overlay hidden">
    <div class="panel">
      <h2>Admin Login</h2>
      <input id="admin-pass" type="password" placeholder="Password">
      <button onclick="validateAdmin()">Login</button>
      <button onclick="hideAdminLogin()">Cancel</button>
    </div>
  </div>

  <!-- HEADER -->
  <header id="main-header" class="hidden">
    <h1>📚 Masasa Online</h1>
    <div>
      <span id="live-time"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <div id="main-content" class="hidden container">

    <!-- ADMIN TOOLS -->
    <div id="admin-tools" class="hidden admin-box">

      <h2>Admin Dashboard</h2>

      <input id="pdf-title" placeholder="Material Title">
      <input id="pdf-file" type="file" accept="application/pdf">
      <button onclick="uploadPDF()">Upload PDF</button>

      <hr>

      <input id="quiz-title" placeholder="Quiz Title">
      <button onclick="addQuestion()">Add Sample Question</button>
      <button onclick="publishQuiz()">Publish Quiz</button>

    </div>

    <!-- STUDENT CONTENT -->
    <h2>📄 Materials</h2>
    <div id="material-list"></div>

    <h2>🧠 Quizzes</h2>
    <div id="quiz-list"></div>

    <div id="quiz-area" class="hidden"></div>

  </div>

  <script type="module" src="index.js"></script>

</body>
</html>
