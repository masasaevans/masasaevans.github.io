<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MasasaEdu - Nairobi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body class="bg-gray-50 font-sans">
  <header class="bg-indigo-700 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-3xl font-bold">MasasaEdu 🇰🇪</h1>
      <div class="flex gap-2 bg-white/20 rounded-lg p-1">
        <button onclick="switchRole('teacher')" id="btn-teacher"
          class="px-6 py-2 rounded-md font-medium transition">Teacher Mode</button>
        <button onclick="switchRole('student')" id="btn-student"
          class="px-6 py-2 rounded-md font-medium transition">Student Mode</button>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-6">
    <!-- Tabs -->
    <div class="flex border-b mb-6">
      <button onclick="switchTab(0)" id="tab-0"
        class="tab-button px-8 py-3 font-medium border-b-4 border-indigo-600 text-indigo-600">Assignments</button>
      <button onclick="switchTab(1)" id="tab-1"
        class="tab-button px-8 py-3 font-medium text-gray-500">Quizzes</button>
    </div>

    <!-- Assignments Section -->
    <div id="assignments-section">
      <div id="teacher-assignments-form" class="hidden bg-white p-6 rounded-2xl shadow mb-8">
        <h2 class="text-xl font-semibold mb-4">Post New Assignment</h2>
        <input id="ass-title" type="text" placeholder="Assignment Title" class="w-full mb-3 p-3 border rounded-lg">
        <textarea id="ass-desc" placeholder="Description" class="w-full mb-3 p-3 border rounded-lg h-24"></textarea>
        <input id="ass-pdf" type="text" value="https://www.learningcontainer.com/wp-content/uploads/2020/05/sample-pdf-file.pdf" 
               placeholder="PDF Link (or leave default)" class="w-full mb-4 p-3 border rounded-lg">
        <button onclick="addAssignment()" 
          class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-medium hover:bg-indigo-700">Post Assignment</button>
      </div>

      <h2 class="text-2xl font-bold mb-4" id="assignments-title">Assignments</h2>
      <div id="assignments-list" class="grid md:grid-cols-2 gap-6"></div>
    </div>

    <!-- Quizzes Section -->
    <div id="quizzes-section" class="hidden">
      <div id="teacher-quiz-form" class="hidden bg-white p-6 rounded-2xl shadow mb-8">
        <h2 class="text-xl font-semibold mb-4">Create Multiple Choice Question</h2>
        <input id="q-text" type="text" placeholder="Question" class="w-full mb-3 p-3 border rounded-lg">
        <div class="grid grid-cols-2 gap-3">
          <input id="opt0" placeholder="Option 1" class="p-3 border rounded-lg">
          <input id="opt1" placeholder="Option 2" class="p-3 border rounded-lg">
          <input id="opt2" placeholder="Option 3" class="p-3 border rounded-lg">
          <input id="opt3" placeholder="Option 4" class="p-3 border rounded-lg">
        </div>
        <select id="correct-index" class="w-full mt-4 p-3 border rounded-lg">
          <option value="0">Option 1 is correct</option>
          <option value="1">Option 2 is correct</option>
          <option value="2">Option 3 is correct</option>
          <option value="3">Option 4 is correct</option>
        </select>
        <button onclick="addMCQ()" class="mt-4 bg-indigo-600 text-white px-8 py-3 rounded-xl font-medium">Add Question</button>
      </div>

      <h2 class="text-2xl font-bold mb-4">Practice Questions</h2>
      <button onclick="startQuiz()" id="start-quiz-btn"
        class="bg-green-600 text-white px-10 py-4 rounded-2xl text-lg font-semibold hidden">🚀 Start Quiz & Get Auto-Graded</button>
      <div id="mcq-list" class="mt-6"></div>
    </div>

    <!-- Quiz Taking Area -->
    <div id="quiz-taking" class="hidden">
      <div class="bg-white rounded-3xl shadow-xl p-8 max-w-4xl mx-auto">
        <h2 class="text-2xl font-bold mb-8 text-center">Quiz Time - Auto Grading</h2>
        <div id="quiz-questions"></div>
        <div class="mt-10 flex gap-4 justify-center">
          <button onclick="submitQuiz()" class="bg-green-600 text-white px-12 py-4 rounded-2xl text-lg font-bold">Submit & See Score</button>
          <button onclick="cancelQuiz()" class="bg-gray-300 px-8 py-4 rounded-2xl">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-8 text-gray-500 text-sm">
    MasasaEdu MVP • Static on GitHub Pages • Made for Kenyan Teachers & Learners
  </footer>
</body>
</html>
