<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Masasa Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-gradient-to-br from-orange-50 to-indigo-50 min-h-screen">

  <!-- LOGIN OVERLAY -->
  <div id="overlay" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-white p-10 rounded-3xl text-center max-w-md w-full shadow-2xl">
      <h1 class="text-4xl font-black mb-8 text-orange-600">Masasa Online 🚀</h1>
      <button onclick="googleLogin()" 
              class="w-full bg-white border-2 border-orange-500 py-5 rounded-3xl font-bold text-lg">
        Sign in with Google
      </button>
      <p class="text-sm text-gray-500 mt-6">Only realmasasa@gmail.com is allowed</p>
    </div>
  </div>

  <!-- HEADER -->
  <header id="header" class="hidden bg-white shadow sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-black text-orange-600">📚 Masasa Online</h1>
      <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-2xl text-sm">Logout</button>
    </div>
  </header>

  <!-- MAIN APP -->
  <main id="app" class="hidden max-w-6xl mx-auto px-6 py-10">
    <div class="bg-white p-8 rounded-3xl shadow mb-10">
      <h2 class="text-2xl font-bold mb-6">Upload New Material</h2>
      <input id="title" placeholder="Material Title" 
             class="w-full p-4 border rounded-2xl mb-4">
      <input id="file" type="file" accept="application/pdf" 
             class="block w-full mb-6">
      <button onclick="upload()" id="uploadBtn"
              class="w-full bg-green-600 hover:bg-green-700 text-white py-5 rounded-3xl font-bold text-lg">
        Upload PDF
      </button>
    </div>

    <h2 class="text-2xl font-bold mb-6">📄 Available Materials</h2>
    <div id="materials" class="space-y-4"></div>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
