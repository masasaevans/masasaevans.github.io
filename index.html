<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masasa Online | Learning Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.7.1/firebase-storage-compat.js"></script>
</head>
<body class="bg-indigo-50 font-sans antialiased overflow-x-hidden">

<div class="marquee-container">
    <div class="marquee-text">🚀 Welcome to Masasa Online! 📚 PDFs & Quizzes • Deadlines & Instant Marking</div>
</div>

<div id="role-overlay" class="fixed inset-0 bg-indigo-900 flex items-center justify-center z-[100] p-4">
  <div class="bg-white rounded-[3rem] p-8 max-w-md w-full text-center shadow-2xl border-8 border-white animate-pop">
    <div class="mb-6 p-4 bg-indigo-50 rounded-3xl border-2 border-indigo-100">
        <div id="live-time" class="text-4xl font-black text-slate-800">00:00:00</div>
        <div id="location-display" class="text-indigo-500 font-bold text-xs uppercase mt-1">📍 Nairobi, KE</div>
    </div>
    <h1 class="bubble-text text-5xl font-black text-indigo-600 mb-8">Masasa Online</h1>
    <div id="role-buttons" class="space-y-4">
        <button onclick="selectRole('student')" class="w-full bg-orange-500 text-white py-6 rounded-3xl text-2xl font-black shadow-[0_10px_0_#c2410c] active:translate-y-1 active:shadow-none transition-all">LEARNER PLACE 👩‍🎓</button>
        <button onclick="showAdminLogin()" class="w-full bg-slate-100 text-slate-500 py-4 rounded-2xl font-bold hover:bg-slate-200">ADMIN 🔐</button>
    </div>
    <div id="admin-login" class="hidden mt-6">
      <input id="admin-pass" type="password" placeholder="Enter Admin Password" class="w-full p-4 border-2 border-indigo-100 rounded-2xl mb-4 text-center font-bold outline-none focus:border-indigo-600">
      <button onclick="validateAdmin()" class="w-full bg-indigo-700 text-white py-4 rounded-2xl font-black shadow-lg">Login as Evans</button>
      <button onclick="hideAdminLogin()" class="mt-4 text-slate-400 text-xs underline block w-full cursor-pointer">Back to Selection</button>
    </div>
  </div>
</div>

<header id="main-header" class="hidden bg-white/90 backdrop-blur-md border-b-2 border-indigo-100 p-4 sticky top-12 z-50">
  <div class="max-w-6xl mx-auto flex justify-between items-center px-4">
    <div class="flex items-center gap-2 bg-yellow-100 px-4 py-2 rounded-full border-2 border-yellow-400">
        <span class="text-xl">⭐</span>
        <span id="star-count" class="font-black text-yellow-700 text-lg">0</span>
    </div>
    <button onclick="logout()" class="bg-red-50 text-red-500 px-6 py-2 rounded-full font-black text-xs border-2 border-red-100 uppercase tracking-widest">Quit Portal</button>
  </div>
</header>

<main id="main-content" class="hidden max-w-6xl mx-auto p-4 md:p-6">
  <!-- ADMIN TOOLS -->
  <section id="admin-tools" class="hidden mb-10 p-6 bg-white rounded-[2.5rem] shadow-xl border-4 border-indigo-200">
      <h3 class="text-xl font-black text-indigo-700 mb-4 uppercase italic">Teacher Management</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- PDF Upload -->
          <div class="bg-indigo-50 p-6 rounded-3xl border-2 border-indigo-100">
              <label class="font-black text-indigo-700 block mb-2 uppercase text-[10px]">1. Upload PDF Lesson</label>
              <input id="pdf-title" type="text" placeholder="PDF Name (e.g. Literacy Week 3)" class="w-full p-3 rounded-xl border mb-2 outline-none">
              <input id="pdf-deadline" type="datetime-local" class="w-full p-3 rounded-xl border mb-2 outline-none">
              <input id="pdf-file" type="file" accept="application/pdf" class="w-full p-2 mb-2 bg-white rounded-xl text-xs">
              <button onclick="uploadPDF()" class="w-full bg-indigo-600 text-white font-black py-3 rounded-xl">Publish PDF</button>
          </div>

          <!-- Quiz Creator -->
          <div class="bg-orange-50 p-6 rounded-3xl border-2 border-orange-100">
              <label class="font-black text-orange-700 block mb-2 uppercase text-[10px]">2. Create Quiz</label>
              <input id="quiz-title" type="text" placeholder="Quiz Title" class="w-full p-3 border rounded-xl mb-2 outline-none">
              <input id="quiz-deadline" type="datetime-local" class="w-full p-3 border rounded-xl mb-4 outline-none">

              <div class="bg-white p-4 rounded-2xl mb-4" id="question-form">
                  <select id="q-type" class="w-full p-3 border rounded-xl mb-2">
                      <option value="mcq">Multiple Choice (MCQ)</option>
                      <option value="short">Short Answer (Structural)</option>
                  </select>
                  <input id="q-text" type="text" placeholder="Question text" class="w-full p-3 border rounded-xl mb-2">
                  
                  <!-- MCQ fields -->
                  <div id="mcq-fields">
                      <div class="grid grid-cols-2 gap-2">
                          <input id="opt1" placeholder="Option A" class="p-2 border rounded">
                          <input id="opt2" placeholder="Option B" class="p-2 border rounded">
                          <input id="opt3" placeholder="Option C" class="p-2 border rounded">
                          <input id="opt4" placeholder="Option D" class="p-2 border rounded">
                      </div>
                      <select id="correct-index" class="w-full mt-2 p-2 border rounded">
                          <option value="0">Correct: A</option>
                          <option value="1">Correct: B</option>
                          <option value="2">Correct: C</option>
                          <option value="3">Correct: D</option>
                      </select>
                  </div>
                  
                  <button onclick="addQuestion()" class="mt-3 w-full bg-orange-500 text-white py-2 rounded-xl text-sm font-bold">+ Add Question to Quiz</button>
              </div>

              <div id="questions-preview" class="mb-4 space-y-2"></div>
              <button onclick="publishQuiz()" class="w-full bg-orange-500 text-white font-black py-3 rounded-xl">Publish Quiz Now</button>
          </div>
      </div>
  </section>

  <!-- LEARNER CONTENT -->
  <section class="mb-8">
      <h3 class="text-2xl font-black text-indigo-700 mb-6 px-4">📚 Materials & Quizzes</h3>
      
      <div class="mb-6">
          <h4 class="font-bold text-indigo-600 mb-3 px-4">📄 PDF Lessons</h4>
          <div id="material-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </div>
      
      <div>
          <h4 class="font-bold text-orange-600 mb-3 px-4">❓ Quizzes</h4>
          <div id="quiz-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </div>
  </section>

  <div id="quiz-area" class="hidden space-y-6 pb-60 pt-10"></div>
</main>

<div id="score-modal" class="hidden fixed inset-0 bg-indigo-900/90 flex items-center justify-center z-[200] p-4">
    <div class="bg-white rounded-[3rem] p-10 max-w-sm w-full text-center border-8 border-white animate-pop">
        <div class="text-8xl mb-4" id="score-emoji">🎉</div>
        <div id="final-percent" class="text-7xl font-black text-orange-500 mb-2">0%</div>
        <p id="score-feedback" class="text-lg font-bold text-slate-500 mb-8 italic"></p>
        <button onclick="closeQuiz()" class="w-full bg-indigo-700 text-white py-4 rounded-2xl font-black shadow-lg uppercase">Continue</button>
    </div>
</div>

<div id="pdf-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[300] p-4">
    <div class="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] flex flex-col">
        <div class="p-4 border-b flex justify-between items-center">
            <h3 id="pdf-modal-title" class="font-black text-xl"></h3>
            <button onclick="closePDF()" class="text-3xl leading-none">×</button>
        </div>
        <iframe id="pdf-frame" class="flex-1 w-full rounded-b-3xl" style="height:80vh"></iframe>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
