<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnSphere</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- CSS -->
<link rel="stylesheet" href="index.css">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- BUBBLES -->
<div id="bubbles"></div>

<!-- HEADER -->
<div class="marquee">
    <div id="top-marquee"></div>
</div>

<div class="container">

    <h1 class="title">LEARNSPHERE</h1>

    <!-- DATE TIME -->
    <div class="datetime">
        <div id="day"></div>
        <div id="date"></div>
        <div id="time"></div>
    </div>

    <!-- NAV -->
    <div class="buttons">
        <button onclick="showSection('extended')">📖 Extended Work</button>
        <button onclick="showSection('assessment')">📝 Assessment</button>
    </div>

    <!-- EXTENDED -->
    <div id="extended-section">
        <div id="extended-grid"></div>
    </div>

    <!-- MCQ -->
    <div id="assessment-section" class="hidden">
        <div id="mcq-area"></div>
    </div>

</div>

<!-- FOOTER -->
<div class="marquee">
    <div id="bottom-marquee"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden">
    <div class="admin-box">

        <h2>ADMIN PANEL</h2>

        <!-- ANNOUNCEMENTS -->
        <input id="announcement-input" placeholder="Announcement">
        <button onclick="addAnnouncement()">Add Announcement</button>

        <!-- PDF -->
        <input id="file-name" placeholder="PDF Name">
        <input id="file-input" type="file">
        <button onclick="uploadPDF()">Upload PDF</button>

        <!-- MCQ -->
        <input id="mcq-question" placeholder="Question">

        <input class="mcq-option" placeholder="Option 1">
        <input class="mcq-option" placeholder="Option 2">
        <input class="mcq-option" placeholder="Option 3">
        <input class="mcq-option" placeholder="Option 4">

        <input id="mcq-answer" type="number" placeholder="Answer (1-4)">
        <button onclick="addMCQ()">Add MCQ</button>

        <button onclick="toggleAdmin()">Close</button>

    </div>
</div>

<!-- JS (IMPORTANT: at bottom) -->
<script src="index.js"></script>

</body>
</html>
