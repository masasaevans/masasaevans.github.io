<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tabs Example</title>
  <style>
    .tabs {
      display: flex;
      cursor: pointer;
      margin-bottom: 1em;
    }
    .tab {
      padding: 10px 20px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      margin-right: 5px;
      border-bottom: none;
      border-radius: 5px 5px 0 0;
    }
    .tab.active {
      background: #fff;
      font-weight: bold;
      border-bottom: 1px solid #fff;
    }
    .tab-content {
      border: 1px solid #ccc;
      padding: 20px;
      background: #fff;
      border-radius: 0 5px 5px 5px;
    }
    .tab-content:not(.active) {
      display: none;
    }
    .login-error {
      color: red;
      font-weight: bold;
    }
    #pdfList a {
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-tab="home">Home</div>
    <div class="tab" data-tab="admin">Admin</div>
  </div>
  <div class="tab-content active" id="home">
    <h2>Home Tab</h2>
    <p>Welcome to the Home tab!</p>
    <div id="pdfSection">
      <h3>Uploaded PDFs:</h3>
      <div id="pdfList"></div>
    </div>
  </div>
  <div class="tab-content" id="admin">
    <h2>Admin Tab</h2>
    <form id="loginForm">
      <label for="password">Enter Admin Password:</label><br>
      <input type="password" id="password" name="password" autocomplete="off"><br><br>
      <button type="submit">Login</button>
    </form>
    <div id="loginMessage"></div>
    <div id="uploadSection" style="display:none;">
      <h3>Upload PDF</h3>
      <form id="pdfUploadForm">
        <input type="file" id="pdfFile" accept="application/pdf" required>
        <button type="submit">Upload PDF</button>
      </form>
      <div id="uploadMessage"></div>
    </div>
  </div>
  <script>
    // Tab logic
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
        this.classList.add('active');
        document.getElementById(this.getAttribute('data-tab')).classList.add('active');
      });
    });

    // Render PDF list in Home tab
    function renderPDFList() {
      const pdfListDiv = document.getElementById('pdfList');
      pdfListDiv.innerHTML = '';
      const pdfs = JSON.parse(localStorage.getItem('pdfs') || '[]');
      if (pdfs.length === 0) {
        pdfListDiv.textContent = "No PDFs uploaded yet.";
        return;
      }
      pdfs.forEach(pdf => {
        const a = document.createElement('a');
        a.href = pdf.url;
        a.textContent = pdf.name;
        a.target = '_blank';
        pdfListDiv.appendChild(a);
      });
    }
    renderPDFList();

    // Admin login logic
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const uploadSection = document.getElementById('uploadSection');
      const loginMessage = document.getElementById('loginMessage');
      if (password === '1989') {
        document.getElementById('loginForm').style.display = 'none';
        uploadSection.style.display = 'block';
        loginMessage.textContent = '';
      } else {
        loginMessage.textContent = 'Incorrect password. Please try again.';
        loginMessage.className = 'login-error';
      }
    });

    // PDF upload logic
    document.getElementById('pdfUploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const fileInput = document.getElementById('pdfFile');
      const file = fileInput.files[0];
      const uploadMessage = document.getElementById('uploadMessage');
      if (file && file.type === "application/pdf") {
        const reader = new FileReader();
        reader.onload = function(ev) {
          const url = ev.target.result;
          const pdfs = JSON.parse(localStorage.getItem('pdfs') || '[]');
          pdfs.push({name: file.name, url: url});
          localStorage.setItem('pdfs', JSON.stringify(pdfs));
          uploadMessage.textContent = "PDF uploaded!";
          uploadMessage.style.color = "green";
          renderPDFList();
        };
        reader.readAsDataURL(file);
      } else {
        uploadMessage.textContent = "Please select a valid PDF file.";
        uploadMessage.style.color = "red";
      }
    });
  </script>
</body>
</html>
